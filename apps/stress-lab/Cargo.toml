[package]
name = "stress-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stress-lab-native"
path = "src/main.rs"

[[bin]]
name = "schema"
required-features = ["schema"]

[package.metadata.engine]
page = "stress.html"
game = "stress"

[features]
default = []
dev = ["engine/dev", "engine_native/dev"]
profiling = ["engine/profiling", "engine_native/profiling"]
schema = ["dep:schemars", "engine/schema"]

[build-dependencies]
engine_sources.workspace = true

[dependencies]
engine.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
engine_native.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[lints]
workspace = true
