[package]
name = "engine_profiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Profiles and GPU captures of native engine games: graphics debuggers' frame captures, and deep profiles, hardware counters and vendor deep dives"

[features]
default = []
profiling = [
    "engine/profiling",
    "dep:serde_json",
    "dep:backtrace",
    "dep:iced-x86",
    "dep:fxprof-processed-profile",
    "dep:windows-sys",
    "dep:libc",
    "dep:mach2",
    "dep:ash",
    "dep:wgpu",
]
load = ["dep:windows-sys"]

[dependencies]
engine.workspace = true
serde_json = { workspace = true, optional = true }
backtrace = { workspace = true, optional = true }
iced-x86 = { workspace = true, optional = true }
fxprof-processed-profile = { workspace = true, optional = true }
ash = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true, features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_System_Performance", "Wdk_Graphics_Direct3D"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "deny"
ambiguous_glob_reexports = "deny"
hidden_glob_reexports = "deny"


[lints.clippy]
dbg_macro = "deny"
todo = "deny"
return_self_not_must_use = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"

[package.metadata.engine]
kind = "host"
