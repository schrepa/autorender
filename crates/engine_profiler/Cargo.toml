[package]
name = "engine_profiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Deep profiles of native engine games"

[features]
default = []
profiling = [
    "engine/profiling",
    "dep:engine_profile",
    "engine_profile/profiling",
    "dep:engine_registry",
    "engine_registry/dev",
    "dep:bevy_ecs",
    "dep:serde",
    "dep:serde_json",
    "dep:backtrace",
    "dep:fxprof-processed-profile",
    "dep:windows-sys",
]

[dependencies]
engine.workspace = true
engine_profile = { workspace = true, optional = true }
engine_registry = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
backtrace = { workspace = true, optional = true }
fxprof-processed-profile = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "deny"
ambiguous_glob_reexports = "deny"
hidden_glob_reexports = "deny"


[lints.clippy]
dbg_macro = "deny"
todo = "deny"
return_self_not_must_use = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"

[package.metadata.engine]
kind = "host"
