[package]
name = "engine_dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
engine_settings.workspace = true
engine_core.workspace = true
engine_collision.workspace = true
engine_physics.workspace = true
engine_scene.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The generated schemas and protocol summary (`schemas`, which
# `cargo xtask schema` runs), profiling's event budget among them.
engine_profile.workspace = true
schemars.workspace = true
engine_settings = { workspace = true, features = ["schema"] }
engine_physics = { workspace = true, features = ["schema"] }
# Environment controls reuse the scene sections, schemas included.
engine_scene = { workspace = true, features = ["schema"] }

[lints]
workspace = true
