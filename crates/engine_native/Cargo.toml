[package]
name = "engine_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autoexamples = false

[features]
default = []
dev = ["engine/dev", "dep:engine_profile", "dep:engine_registry", "dep:png"]
profiling = ["dev", "engine/profiling", "engine_profiler/profiling"]

[dependencies]
cpal.workspace = true
lewton.workspace = true
engine.workspace = true
engine_core.workspace = true
engine_profiler.workspace = true
serde_json.workspace = true
winit.workspace = true
gilrs.workspace = true
pollster.workspace = true
engine_profile = { workspace = true, optional = true }
engine_registry = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.engine]
kind = "host"
