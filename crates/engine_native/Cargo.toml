[package]
name = "engine_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# The engine's development tools and profiling, as games build them.
dev = ["engine/dev"]
profiling = ["engine/profiling"]

[dependencies]
engine.workspace = true
engine_worker.workspace = true
png.workspace = true
sha2.workspace = true
serde_json.workspace = true
zune-jpeg.workspace = true
winit.workspace = true
pollster.workspace = true

# A new game's native entry, as `cargo xtask new app` writes it; lint
# compiles it with the app template.
[[example]]
name = "app_native"

[lints]
workspace = true
