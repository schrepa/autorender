[package]
name = "engine_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autoexamples = false

[features]
default = []
dev = ["engine/dev", "dep:base64", "dep:engine_registry", "dep:sha2"]
profiling = ["engine/profiling", "engine_profiler/profiling"]

[dependencies]
engine.workspace = true
engine_core.workspace = true
engine_profile.workspace = true
engine_profiler.workspace = true
engine_worker.workspace = true
png.workspace = true
serde_json.workspace = true
winit.workspace = true
gilrs.workspace = true
pollster.workspace = true
zstd.workspace = true
base64 = { workspace = true, optional = true }
engine_registry = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.engine]
kind = "host"
