[package]
name = "engine_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autoexamples = false

[features]
default = []
dev = ["engine/dev", "engine_profiler/load", "dep:gltf", "dep:naga", "dep:tiff", "dep:toml_edit", "dep:zip"]
profiling = ["engine/profiling", "engine_profiler/profiling"]

[dependencies]
engine.workspace = true
engine_profiler.workspace = true
engine_worker.workspace = true
png.workspace = true
sha2.workspace = true
serde_json.workspace = true
winit.workspace = true
gilrs.workspace = true
pollster.workspace = true
zstd.workspace = true
gltf = { workspace = true, optional = true }
naga = { workspace = true, optional = true, features = ["wgsl-in", "spv-out"] }
tiff = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.engine]
kind = "host"
