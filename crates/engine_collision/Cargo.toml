[package]
name = "engine_collision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# JSON schemas of the collision budgets (`settings!`).
schema = ["dep:schemars", "engine_settings/schema"]
default = []
profiling = ["engine_profile/enabled", "engine_core/profiling"]
attribution = ["engine_core/attribution"]

[dependencies]
engine_core.workspace = true
engine_profile.workspace = true
engine_settings.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
glam.workspace = true
parry3d.workspace = true
schemars = { workspace = true, optional = true }

[lints]
workspace = true
