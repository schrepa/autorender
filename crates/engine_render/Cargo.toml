[package]
name = "engine_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Owned WebGPU resources and instanced 3D rendering for the browser engine"

[features]
dev = ["engine_profile/bricks"]
profiling = ["engine_profile/enabled", "engine_core/profiling"]

[dependencies]
engine_core.workspace = true
engine_registry.workspace = true
engine_profile.workspace = true
engine_textures.workspace = true
bevy_ecs.workspace = true
bytemuck.workspace = true
glam.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu-types.workspace = true
wesl.workspace = true

[dependencies.wgpu]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wgpu]
workspace = true
features = ["dx12", "vulkan", "metal", "noop"]

[lints.rust]
unsafe_code = "deny"
ambiguous_glob_reexports = "deny"
hidden_glob_reexports = "deny"


[lints.clippy]
dbg_macro = "deny"
todo = "deny"
return_self_not_must_use = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"


[package.metadata.engine]
kind = "core"
