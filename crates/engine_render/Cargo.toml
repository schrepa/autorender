[package]
name = "engine_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Owned WebGPU resources and instanced 3D rendering for the browser engine"

[features]
dev = ["engine_profile/bricks"]
profiling = ["engine_profile/enabled", "engine_core/profiling"]

[dependencies]
engine_core.workspace = true
engine_profile.workspace = true
engine_terrain.workspace = true
engine_textures.workspace = true
engine_time_of_day.workspace = true
bytemuck.workspace = true
glam.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu-types.workspace = true
wesl.workspace = true

[dependencies.wgpu]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wgpu]
workspace = true
features = ["dx12", "vulkan", "metal"]

[build-dependencies]
engine_sources.workspace = true

[lints]
workspace = true
