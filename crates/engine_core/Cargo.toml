[package]
name = "engine_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
dev = ["engine_profile/dev", "engine_registry/profiling"]
profiling = ["engine_profile/profiling", "engine_registry/profiling"]
schema = ["engine_assets/schema", "engine_settings/schema", "engine_place/schema"]

[dependencies]
engine_place.workspace = true
engine_registry.workspace = true
engine_codec.workspace = true
engine_assets.workspace = true
engine_math.workspace = true
engine_settings.workspace = true
engine_profile.workspace = true
bevy_app.workspace = true
bevy_ecs = { workspace = true, features = ["debug"] }
bytemuck.workspace = true
glam.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
engine_textures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Storage"] }

[lints]
workspace = true

[package.metadata.engine]
kind = "core"
