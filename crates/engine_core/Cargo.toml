[package]
name = "engine_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
dev = []
profiling = ["engine_profile/enabled"]
# Profiling only: hot helpers out of line for sampling attribution.
attribution = []
# JSON schemas of the settings types, for authoring tools (engine_scene's
# `schema`): they are a scene's environment sections.
schema = ["dep:schemars", "engine_assets/schema", "engine_settings/schema", "engine_terrain/schema"]

[dependencies]
engine_assets.workspace = true
engine_math.workspace = true
engine_settings.workspace = true
engine_terrain.workspace = true
engine_profile.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
glam.workspace = true
serde.workspace = true
schemars = { workspace = true, optional = true }

[lints]
workspace = true
