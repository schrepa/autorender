[package]
name = "engine_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
dev = ["engine_profile/bricks"]
profiling = ["engine_profile/enabled"]
attribution = []
schema = ["engine_assets/schema", "engine_settings/schema"]

[dependencies]
engine_place.workspace = true
engine_registry.workspace = true
engine_codec.workspace = true
engine_assets.workspace = true
engine_math.workspace = true
engine_settings.workspace = true
engine_profile.workspace = true
bevy_app.workspace = true
bevy_ecs = { workspace = true, features = ["debug"] }
bytemuck.workspace = true
glam.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
engine_textures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
engine_lodbuild.workspace = true

[build-dependencies]
sha2.workspace = true

[[example]]
name = "brick_template"
crate-type = ["rlib"]

[lints]
workspace = true

[package.metadata.engine]
kind = "core"
