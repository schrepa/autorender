[package]
name = "fruit_fps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fruit_fps-native"
path = "src/main.rs"

[[bin]]
name = "fruit_fps-cook"
path = "src/cook/main.rs"

[package.metadata.engine]
kind = "game"
page = "fruit_fps.html"
game = "fruit_fps"
native = "fruit_fps-native"
cook = "fruit_fps-cook"
ship = ["data", "assets/ui"]

[features]
default = []
dev = ["engine/dev", "engine_native/dev"]
profiling = ["dev", "engine/profiling", "engine_native/profiling"]

[build-dependencies]
engine_sources.workspace = true

[dependencies]
engine.workspace = true
engine_bindings.workspace = true
engine_touch.workspace = true
engine_core.workspace = true
engine_ecs.workspace = true
engine_math.workspace = true
engine_meshpack.workspace = true
engine_nav.workspace = true
engine_render.workspace = true
engine_rig.workspace = true
engine_solids.workspace = true
engine_visible_sets.workspace = true
engine_drawing.workspace = true
brick_sound.workspace = true
brick_present.workspace = true
brick_touch.workspace = true
brick_interface.workspace = true
bytemuck.workspace = true
glam.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
engine_native.workspace = true
cook.workspace = true
cook_rays.workspace = true
cook_model.workspace = true
cook_texture.workspace = true
gltf.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[lints]
workspace = true
