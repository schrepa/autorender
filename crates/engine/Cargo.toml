[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
dev = ["dep:engine_dev", "engine_core/dev"]
profiling = ["engine_profile/enabled", "engine_core/profiling", "engine_collision/profiling", "engine_render/profiling"]
attribution = ["engine_core/attribution", "engine_collision/attribution"]
# JSON schemas of settings apps declare (`engine::settings`), and of the
# types hosts share (`engine::host`), for their tooling.
schema = ["engine_core/schema", "engine_settings/schema", "engine_panic/schema", "dep:schemars"]

[dependencies]
engine_core.workspace = true
engine_profile.workspace = true
engine_collision.workspace = true
engine_scene.workspace = true
engine_dev = { workspace = true, optional = true }
engine_settings.workspace = true
engine_render.workspace = true
engine_panic.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true

# The game `cargo xtask new app` starts from; lint compiles it.
[[example]]
name = "app_template"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
