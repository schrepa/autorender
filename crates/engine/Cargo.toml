[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autoexamples = false

[features]
default = []
dev = ["dep:engine_dev", "dep:sha2", "dep:schemars", "engine_core/dev", "engine_render/dev", "engine_profile/dev", "engine_settings/dev", "engine_panic/dev", "engine_scene/dev"]
profiling = ["dev", "engine_profile/profiling", "engine_core/profiling", "engine_render/profiling"]

[dependencies]
engine_command_line.workspace = true
engine_core.workspace = true
engine_registry.workspace = true
engine_profile.workspace = true
engine_scene.workspace = true
engine_settings.workspace = true
engine_render.workspace = true
engine_dev = { workspace = true, optional = true }
engine_panic.workspace = true
bevy_ecs.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Storage"] }

[lints]
workspace = true

[package.metadata.engine]
kind = "host"
