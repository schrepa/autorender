[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
dev = ["dep:engine_dev", "engine_core/dev", "engine_render/dev"]
profiling = ["engine_profile/enabled", "engine_core/profiling", "engine_collision/profiling", "engine_physics/profiling", "engine_render/profiling", "engine_terrain/profiling"]
attribution = ["engine_core/attribution", "engine_collision/attribution"]
schema = ["engine_core/schema", "engine_settings/schema", "engine_panic/schema", "engine_scene/schema", "engine_terrain/schema", "engine_world_streaming/schema", "engine_navigation/schema", "engine_time_of_day/schema", "engine_collision/schema", "engine_physics/schema", "dep:schemars"]

[dependencies]
engine_core.workspace = true
engine_profile.workspace = true
engine_collision.workspace = true
engine_physics.workspace = true
engine_terrain.workspace = true
engine_world_streaming.workspace = true
engine_navigation.workspace = true
engine_time_of_day.workspace = true
engine_scene.workspace = true
engine_dev = { workspace = true, optional = true }
engine_settings.workspace = true
engine_render.workspace = true
engine_panic.workspace = true
engine_worker.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true

[[example]]
name = "app_template"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[package.metadata.engine]
core = true
