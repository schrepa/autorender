[package]
name = "engine_worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Job workers beside the games: xtask builds them as a browser client.
[package.metadata.engine]
worker = true

[dependencies]
engine_terrain.workspace = true
# The job cache's keys and index (`JobCache`).
engine_math.workspace = true
sha2.workspace = true
serde_json.workspace = true
# Images as every host decodes them (`decode_image`).
png.workspace = true
zune-jpeg.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
engine_panic.workspace = true

[lints]
workspace = true
