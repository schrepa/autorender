[workspace]
members = ["crates/engine", "crates/engine_core", "crates/engine_math", "crates/engine_settings", "crates/engine_assets", "crates/engine_textures", "crates/engine_scene", "crates/engine_render", "crates/engine_dev", "crates/engine_profile", "crates/engine_sources", "crates/engine_native", "crates/engine_profiler", "crates/engine_panic", "tools/xtask", "tools/xtask_engine", "crates/engine_checks", "crates/engine_ecs", "crates/engine_place", "crates/engine_registry", "crates/engine_codec", "tools/kinds", "crates/engine_gpu_bits", "tools/command_line", "crates/engine_rig", "tools/glb_cook", "tools/cook", "tools/cook_texture", "tools/cook_model", "crates/engine/examples/fruit_fps"]
resolver = "3"
exclude = ["vendor", "archive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
cpal = { version = "=0.18.2", default-features = false }
lewton = { version = "=0.10.2", default-features = false, features = ["ogg"] }
engine = { path = "crates/engine" }
engine_core = { path = "crates/engine_core" }
engine_math = { path = "crates/engine_math" }
engine_settings = { path = "crates/engine_settings" }
engine_profile = { path = "crates/engine_profile" }
engine_sources = { path = "crates/engine_sources" }
engine_render = { path = "crates/engine_render" }
engine_assets = { path = "crates/engine_assets" }
engine_textures = { path = "crates/engine_textures" }
engine_scene = { path = "crates/engine_scene" }
engine_dev = { path = "crates/engine_dev" }
engine_native = { path = "crates/engine_native" }
engine_profiler = { path = "crates/engine_profiler" }
engine_panic = { path = "crates/engine_panic" }
engine_command_line = { path = "tools/command_line" }
xtask = { path = "tools/xtask" }
engine_checks = { path = "crates/engine_checks" }
engine_ecs = { path = "crates/engine_ecs" }
engine_place = { path = "crates/engine_place" }
engine_gpu_bits = { path = "crates/engine_gpu_bits" }
engine_registry = { path = "crates/engine_registry" }
engine_codec = { path = "crates/engine_codec" }
engine_rig = { path = "crates/engine_rig" }
cook = { path = "tools/cook" }
cook_texture = { path = "tools/cook_texture" }
cook_model = { path = "tools/cook_model" }
base64 = "=0.22.1"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "allow_empty_texture", "KHR_texture_transform", "KHR_materials_emissive_strength"] }
png = "=0.17.16"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
schemars = "=1.2.2"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
glam = { version = "=0.30.9", features = ["serde"] }
libm = { version = "=0.2.16", default-features = false }
foldhash = { version = "=0.2.0", default-features = false }
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
gilrs = "=0.11.2"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioListener", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "DistanceModelType", "GainNode", "PannerNode", "PanningModelType", "HtmlCanvasElement", "Window", "Performance", "console", "Headers", "Request", "RequestInit", "Response", "UrlSearchParams"] }
winit = "=0.30.13"
pollster = "=0.4.0"
zune-jpeg = "=0.5.15"
backtrace = "=0.3.76"
fxprof-processed-profile = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_WindowsProgramming"] }
naga = "=30.0.1"
wesl = { version = "=0.6.0", default-features = false }
wgsl-parse = { version = "=0.6.0", features = ["wesl"] }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse"] }
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = "=2.0.119"

[workspace.lints.rust]
unsafe_code = "forbid"
ambiguous_glob_reexports = "deny"
hidden_glob_reexports = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
return_self_not_must_use = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = "abort"
codegen-units = 16
incremental = true

[profile.profiling]
inherits = "release"
debug = 1

[patch.crates-io]
glam = { path = "vendor/glam" }
wgpu = { path = "vendor/wgpu" }
wgpu-hal = { path = "vendor/wgpu-hal" }
