[workspace]
members = ["crates/engine", "crates/engine_core", "crates/engine_math", "crates/engine_assets", "crates/engine_scene", "crates/engine_render", "crates/engine_dev", "crates/engine_collision", "crates/engine_profile", "examples/orbit-demo", "examples/playground", "examples/stress-lab", "tools/xtask", "tools/assetc"]
resolver = "3"
# The vendored glam copy is patched in below, not a workspace member.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
engine_core = { path = "crates/engine_core" }
engine_math = { path = "crates/engine_math" }
engine_profile = { path = "crates/engine_profile" }
engine_collision = { path = "crates/engine_collision" }
parry3d = { version = "=0.26.1", default-features = false, features = ["required-features", "std", "alloc"] }
engine_render = { path = "crates/engine_render" }
engine_assets = { path = "crates/engine_assets" }
engine_scene = { path = "crates/engine_scene" }
engine_dev = { path = "crates/engine_dev" }
engine_assetc = { path = "tools/assetc" }
base64 = "=0.22.1"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }
png = "=0.17.16"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
glam = "=0.30.9"
libm = { version = "=0.2.16", default-features = false }
bytemuck = { version = "1.23", features = ["derive"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement", "Window", "Performance", "console"] }
console_error_panic_hook = "0.1.7"
naga = { version = "30.0.0", features = ["wgsl-in"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 1

[profile.dev.package."*"]
opt-level = 2

# glam 0.30.9 with f32 sine/cosine routed to engine_math: vendor/glam/VENDORED.md.
[patch.crates-io]
glam = { path = "vendor/glam" }
