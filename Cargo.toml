[workspace]
members = ["crates/engine_follow_camera", "crates/engine_screens", "crates/engine_ui", "crates/engine_text", "crates/engine_audio", "crates/engine", "crates/engine_core", "crates/engine_math", "crates/engine_settings", "crates/engine_assets", "crates/engine_textures", "crates/engine_scene", "crates/engine_render", "crates/engine_dev", "crates/engine_collision", "crates/engine_physics", "crates/engine_profile", "crates/engine_terrain", "crates/engine_layer_noise", "crates/engine_layer_stamps", "crates/engine_layer_heightmap", "crates/engine_layer_paths", "crates/engine_layer_erosion", "crates/engine_layer_hydrology", "crates/engine_layer_relief", "crates/engine_world_streaming", "crates/engine_time_of_day", "crates/engine_sources", "crates/engine_worker", "crates/engine_native", "crates/engine_profiler", "crates/engine_panic", "crates/engine_player", "examples/highlands", "tools/xtask", "tools/assetc", "tools/lodbuild", "tools/coresmoke", "crates/engine_navigation", "crates/engine_checks", "crates/engine_places", "crates/engine_grounding", "crates/engine_sun", "crates/engine_lighting", "crates/engine_meshes", "crates/engine_shadows", "crates/engine_lights", "crates/engine_sky", "crates/engine_taa", "crates/engine_auto_exposure", "crates/engine_tonemap", "crates/engine_terrain_shading", "crates/engine_scatter", "crates/engine_ground_cover", "crates/engine_water", "crates/engine_probes", "crates/engine_particles", "crates/engine_debug_view", "crates/engine_ambient_occlusion", "crates/engine_reflections", "crates/engine_bloom", "crates/engine_dither", "crates/engine_ecs", "crates/engine_place", "crates/engine_registry", "crates/engine_heightfield", "crates/engine_codec", "crates/engine_standard", "crates/engine_standard_smokes", "crates/engine_wind", "crates/engine_splines", "crates/engine_fly_camera", "crates/engine_sprites", "tools/kinds", "crates/engine/examples/app_template"]
