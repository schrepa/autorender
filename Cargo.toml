[workspace]
members = ["crates/engine", "crates/engine_core", "crates/engine_math", "crates/engine_settings", "crates/engine_assets", "crates/engine_textures", "crates/engine_scene", "crates/engine_render", "crates/engine_dev", "crates/engine_collision", "crates/engine_physics", "crates/engine_profile", "crates/engine_terrain", "crates/engine_tables", "crates/engine_sources", "crates/engine_worker", "crates/engine_native", "crates/engine_profiler", "crates/engine_panic", "crates/engine_player", "examples/highlands", "tools/xtask", "tools/assetc", "tools/lodbuild", "tools/policy", "tools/coresmoke"]
resolver = "3"
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
engine_core = { path = "crates/engine_core" }
engine_math = { path = "crates/engine_math" }
engine_settings = { path = "crates/engine_settings" }
engine_profile = { path = "crates/engine_profile" }
engine_collision = { path = "crates/engine_collision" }
engine_physics = { path = "crates/engine_physics" }
rapier3d = { version = "=0.32.0", default-features = false, features = ["dim3", "f32"] }
engine_terrain = { path = "crates/engine_terrain" }
engine_tables = { path = "crates/engine_tables" }
engine_sources = { path = "crates/engine_sources" }
parry3d = { version = "=0.26.1", default-features = false, features = ["required-features", "std", "alloc"] }
engine_render = { path = "crates/engine_render" }
engine_assets = { path = "crates/engine_assets" }
engine_textures = { path = "crates/engine_textures" }
engine_scene = { path = "crates/engine_scene" }
engine_dev = { path = "crates/engine_dev" }
engine_native = { path = "crates/engine_native" }
engine_profiler = { path = "crates/engine_profiler" }
engine_worker = { path = "crates/engine_worker" }
engine_panic = { path = "crates/engine_panic" }
engine_assetc = { path = "tools/assetc" }
engine_lodbuild = { path = "tools/lodbuild" }
policy = { path = "tools/policy" }
base64 = "=0.22.1"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "allow_empty_texture", "KHR_texture_transform", "KHR_materials_emissive_strength"] }
png = "=0.17.16"
texture2ddecoder = "=0.1.2"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw"] }
sha2 = "=0.10.9"
ruzstd = { version = "=0.9.1", default-features = false, features = ["std"] }
zstd = { version = "=0.14.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
schemars = "=1.2.2"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
glam = "=0.30.9"
libm = { version = "=0.2.16", default-features = false }
foldhash = { version = "=0.2.0", default-features = false }
bytemuck = { version = "=1.25.2", features = ["derive"] }
cc = "=1.5.1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
wgpu-types = { version = "=30.0.1", default-features = false, features = ["serde"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement", "Window", "Performance", "console", "Headers", "Request", "RequestInit", "Response", "UrlSearchParams"] }
winit = "=0.30.13"
pollster = "=0.4.0"
zune-jpeg = "=0.5.15"
backtrace = "=0.3.76"
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
fxprof-processed-profile = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_WindowsProgramming"] }
libc = "=0.2.189"
mach2 = "=0.7.0"
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std"] }
naga = "=30.0.1"
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse"] }

[workspace.lints.rust]
unsafe_code = "deny"
ambiguous_glob_reexports = "deny"
hidden_glob_reexports = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
return_self_not_must_use = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 1

[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
glam = { path = "vendor/glam" }
wgpu-hal = { path = "vendor/wgpu-hal" }
