engine_place = { path = "crates/engine_place" }
engine_registry = { path = "crates/engine_registry" }
engine_heightfield = { path = "crates/engine_heightfield" }
engine_codec = { path = "crates/engine_codec" }
engine_standard = { path = "crates/engine_standard" }
engine_standard_smokes = { path = "crates/engine_standard_smokes" }
engine_wind = { path = "crates/engine_wind" }
engine_splines = { path = "crates/engine_splines" }
engine_fly_camera = { path = "crates/engine_fly_camera" }
engine_sprites = { path = "crates/engine_sprites" }
