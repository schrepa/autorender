zstd = { version = "=0.14.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
schemars = "=1.2.2"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
glam = { version = "=0.30.9", features = ["serde"] }
libm = { version = "=0.2.16", default-features = false }
foldhash = { version = "=0.2.0", default-features = false }
indexmap = { version = "=2.14.2", default-features = false }
bevy_platform = { version = "=0.19.1", default-features = false }
hashbrown = { version = "=0.16.1", default-features = false }
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
cc = "=1.5.1"
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2"] }
taffy = "=0.15.1"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
gilrs = "=0.11.2"
kira = { version = "=0.12.6", default-features = false, features = ["cpal", "ogg", "vorbis", "mp3", "flac", "wav", "pcm"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
wgpu-types = { version = "=30.0.1", default-features = false, features = ["serde"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioListener", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "DistanceModelType", "GainNode", "PannerNode", "PanningModelType", "HtmlCanvasElement", "Window", "Performance", "console", "Headers", "Request", "RequestInit", "Response", "UrlSearchParams"] }
winit = "=0.30.13"
pollster = "=0.4.0"
zune-jpeg = "=0.5.15"
backtrace = "=0.3.76"
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
fxprof-processed-profile = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_WindowsProgramming"] }
libc = "=0.2.189"
mach2 = "=0.7.0"
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std"] }
naga = "=30.0.1"
wesl = { version = "=0.6.0", default-features = false }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse"] }

[workspace.lints.rust]
unsafe_code = "forbid"
ambiguous_glob_reexports = "deny"
hidden_glob_reexports = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
return_self_not_must_use = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 1

[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
glam = { path = "vendor/glam" }
wgpu-hal = { path = "vendor/wgpu-hal" }
