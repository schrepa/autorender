# Engine trigonometry, minimum, maximum and clamping are branch-free and give
# the same bits on native targets and in browsers; the standard functions
# mispredict in Wasm.
disallowed-methods = [
    { path = "f32::sin", reason = "use engine::math::sin" },
    { path = "f32::cos", reason = "use engine::math::cos" },
    { path = "f32::sin_cos", reason = "use engine::math::sin_cos" },
    { path = "f32::min", reason = "use engine::math::min: browsers compile f32::min to a branch" },
    { path = "f32::max", reason = "use engine::math::max: browsers compile f32::max to a branch" },
    { path = "f32::clamp", reason = "use engine::math::clamp: browsers compile f32::clamp to branches" },
    # A panic is fatal to the engine on every host: builds abort, Wasm cannot
    # unwind, and a half-changed world is not safe to keep running.
    { path = "std::panic::catch_unwind", reason = "a panic stops the engine for good (engine_panic); return an error instead" },
    { path = "std::panic::set_hook", reason = "engine_panic::install is the engine's one panic hook" },
]

# Hash maps and sets iterate in the same order every run: the standard
# library's seed SipHash at random. Removal queues lose what fixed ticks
# skip.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "use engine_math::collections::HashMap (engine_core::collections, engine::collections): a fixed hasher, the same order every run" },
    { path = "std::collections::HashSet", reason = "use engine_math::collections::HashSet (engine_core::collections, engine::collections): a fixed hasher, the same order every run" },
    { path = "std::hash::RandomState", reason = "use engine_math::collections::FixedState: the same hashes every run" },
    { path = "bevy_ecs::lifecycle::RemovedComponents", reason = "removals between the fixed ticks that read them are lost: observe Remove (or Despawn) instead" },
]

# Functions longer than this fail (Cargo.toml's too_many_lines).
too-many-lines-threshold = 150
