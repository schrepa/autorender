disallowed-methods = [
    { path = "f32::sin", reason = "use engine::math::sin" },
    { path = "f32::cos", reason = "use engine::math::cos" },
    { path = "f32::sin_cos", reason = "use engine::math::sin_cos" },
    { path = "f32::atan2", reason = "use engine::math::atan2" },
    { path = "f32::min", reason = "use engine::math::min: browsers compile f32::min to a branch" },
    { path = "f32::max", reason = "use engine::math::max: browsers compile f32::max to a branch" },
    { path = "f32::clamp", reason = "use engine::math::clamp: browsers compile f32::clamp to branches" },
    { path = "f32::mul_add", reason = "write a * b + c: a fused multiply-add rounds once, so records would differ between hosts" },
    { path = "f64::mul_add", reason = "write a * b + c: a fused multiply-add rounds once, so records would differ between hosts" },
    { path = "std::panic::catch_unwind", reason = "a panic stops the engine for good (engine_panic); return an error instead" },
    { path = "std::panic::set_hook", reason = "engine_panic::install is the engine's one panic hook" },
    { path = "wgpu::Device::create_pipeline_layout", reason = "use engine_render's pipelines::pipeline_layout: each layout is a pipeline_layouts! row, which lint holds to the device limits" },
    { path = "wgpu::Device::create_bind_group", reason = "use engine_render's pipelines::group or filled_group: they bind a bindings table's entries by name" },
    { path = "wgpu::Device::create_render_pipeline", reason = "use engine_render's pipelines::geometry, sampled or fullscreen: they key every pipeline, which the scene's pipeline list records" },
    { path = "wgpu::Device::create_compute_pipeline", reason = "use engine_render's pipelines::compute_entry: it keys every pipeline, which the scene's pipeline list records" },
    { path = "wgpu::Queue::submit", reason = "use engine_render's gpu_calls::Queue: submit for frames, submit_now (counted) for work submitted at once" },
    { path = "wgpu::Device::push_error_scope", reason = "use engine_render's gpu_calls::validation_scope: scopes cover creation, never a frame's work" },
    { path = "wgpu::Device::create_buffer", reason = "use engine_render's memory::buffer: it records the buffer's owner, size and frame" },
    { path = "wgpu::Device::create_texture", reason = "use engine_render's memory::texture: it records the texture's owner, size and frame" },
    { path = "wgpu::util::DeviceExt::create_buffer_init", reason = "use engine_render's memory::buffer_init: it records the buffer's owner, size and frame" },
    { path = "wgpu::util::DeviceExt::create_texture_with_data", reason = "use engine_render's memory::texture and gpu_calls::Queue::write_texture: they record the owner and repeated uploads" },
    { path = "wgpu::Queue::write_buffer", reason = "use engine_render's gpu_calls::Queue::write_buffer: it records repeated uploads by owner" },
    { path = "wgpu::Queue::write_texture", reason = "use engine_render's gpu_calls::Queue::write_texture: it records repeated uploads by owner" },
]

disallowed-types = [
    { path = "std::collections::HashMap", reason = "use engine_math::collections::HashMap (engine_core::collections, engine::collections): a fixed hasher, the same order every run" },
    { path = "std::collections::HashSet", reason = "use engine_math::collections::HashSet (engine_core::collections, engine::collections): a fixed hasher, the same order every run" },
    { path = "std::hash::RandomState", reason = "use engine_math::collections::FixedState: the same hashes every run" },
    { path = "bevy_ecs::lifecycle::RemovedComponents", reason = "removals between the fixed ticks that read them are lost: observe Remove (or Despawn) instead" },
]

too-many-lines-threshold = 120
