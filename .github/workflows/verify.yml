name: Verify engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Cache Cargo dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install the Wasm binding generator Cargo.lock pins
        run: cargo install wasm-bindgen-cli --version "$(cargo xtask wasm-bindgen-version)" --locked
      - run: cargo xtask lint
      - run: cargo xtask build
      - run: cargo xtask docs
