[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
engine_scene = { workspace = true, features = ["schema"] }
engine_dev.workspace = true
# The pure checks' corpora run engine code directly, and meshoptimizer;
# the terrain corpus's jobs replay in Wasm from base64.
base64.workspace = true
engine_assets.workspace = true
engine_core.workspace = true
engine_terrain.workspace = true
engine_vgbuild.workspace = true
engine_native.workspace = true
glam.workspace = true
gltf.workspace = true
png.workspace = true
tiff.workspace = true
engine_render.workspace = true
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }
# The shader report checks the analyzer it downloads.
sha2.workspace = true
engine_assetc.workspace = true
# What other programs did while a measured run was timed.
engine_profiler = { workspace = true, features = ["load"] }
# The game surface's types, the types hosts share and the TypeScript
# generator.
engine = { workspace = true, features = ["schema"] }
# The repository policy lint checks first.
policy.workspace = true
# Systems' and components' names, which schedule ambiguities report.
bevy_ecs = { workspace = true, features = ["debug"] }
serde_json.workspace = true

[lints]
workspace = true
