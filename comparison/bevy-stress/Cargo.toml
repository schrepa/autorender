[package]
name = "bevy-stress-comparison"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this application and its dependency graph separate from our engine.
[workspace]
resolver = "3"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "webgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["Window", "Location", "UrlSearchParams"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
